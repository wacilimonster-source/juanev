function txtU8(t){return new TextEncoder().encode(t)}
let CRC_T=null;
function crc32(d){if(!CRC_T){CRC_T=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CRC_T[n]=c>>>0}}

// 最小 zip 打包（存储方式，不压缩）
function zipFiles(files){const parts=[],cd=[];let off=0;const DOSDATE=0x5C21;
 files.forEach(f=>{const name=txtU8(f.name),data=f.data,crc=crc32(data);
  const lh=new Uint8Array(30+name.length),dv=new DataView(lh.buffer);
  dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);dv.setUint16(8,0,true);
  dv.setUint16(10,0,true);dv.setUint16(12,DOSDATE,true);dv.setUint32(14,crc,true);
  dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);
  dv.setUint16(26,name.length,true);dv.setUint16(28,0,true);lh.set(name,30);
  parts.push(lh,data);
  const c=new Uint8Array(46+name.length),cv=new DataView(c.buffer);
  cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);cv.setUint16(10,0,true);
  cv.setUint16(12,0,true);cv.setUint16(14,DOSDATE,true);cv.setUint32(16,crc,true);
  cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
  cv.setUint16(28,name.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);
  cv.setUint32(38,0,true);cv.setUint32(42,off,true);c.set(name,46);
  cd.push(c);off+=lh.length+data.length});
 const cdStart=off,cdLen=cd.reduce((a,c)=>a+c.length,0);
 const eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);

 return new Blob(parts.concat(cd,[eocd]),{type:'application/zip'})}

function batchSave(){const v=['bag','bac','bar'].map(id=>document.getElementById(id).value.trim());
 const bad=t=>{const e=document.getElementById('berr');e.textContent=t;e.style.display='block'};
 if(v.some(x=>x===''||!/^\d+$/.test(x)))return bad('请填写显卡数、CPU、内存（非负整数）');
 if(v.every(x=>+x===0))return bad('至少一项配额需大于 0');
 const k=ADIST.length,g=+v[0],c=+v[1],r=+v[2];
 BA={gpu:v[0],cpu:v[1],ram:v[2]};
 ADIST.forEach((row,i)=>ADIST[i]=[row[0],`显卡数:${g}卡/${g}卡　CPU:${c}核/${c}核　内存数:${r}G/${r}G`,now()]);

// 编号 = 数组下标 + 1，页面角标与改动导航共用同一编号
const CLNO=c=>c.no||(CL.indexOf(c)+1);
const CLN=k=>{const c=CL.find(x=>x.k==k);return c?CLNO(c):0};
const CLBY=n=>CL.find(c=>CLNO(c)===n);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function pn(k){const i=CLN(k);if(!i)return'';const c=CLBY(i);
 return `<i class="pn" data-k="${c.k}" title="改动 ${i}｜${c.t}｜${c.title}" onclick="event.stopPropagation();pnCard(this,${i})">${i}</i>`}
let pncEl=null;
function closePn(){if(pncEl){pncEl.remove();pncEl=null}}
function pnCard(el,i){closePn();const c=CLBY(i);if(!c||!el)return;
 const d=document.createElement('div');d.className='pnc';
 d.innerHTML=`<span class="px" onclick="closePn()">✕</span>
  <div class="ph"><span class="pno">${i}</span><span class="pt">${esc(c.title)}</span><span class="tag ${TC[c.t]}" style="margin-left:auto;flex:none">${c.t}</span></div>
  <div class="pb">${dsc(c)}</div>
  <div class="pf"><span class="lk" style="margin:0" onclick="closePn();clJump(${i})">在改动导航中查看 →</span></div>`;
 d.onclick=ev=>ev.stopPropagation();
 document.body.appendChild(d);
 const r=el.getBoundingClientRect(),w=390,h=d.offsetHeight;
 let left=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8);
 let top=r.bottom+8;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-8);
 d.style.left=left+'px';d.style.top=top+'px';pncEl=d}

function clOpen(i){const c=CLBY(i);if(!c||c.pg===false)return;c.act();
 setTimeout(()=>{const el=document.querySelector('.mn .pn[data-k="'+c.k+'"]')||document.querySelector('.pn[data-k="'+c.k+'"]');
  if(el){el.scrollIntoView({block:'center'});setTimeout(()=>pnCard(el,i),160)}else clJump(i)},700)}

 const table=g=>{const rows=CL.map((c,k)=>({c,k})).filter(x=>x.c.g==g);

 return `<style>.gd table{table-layout:fixed}.gd th:nth-child(1){width:44px}.gd th:nth-child(2){width:70px}.gd th:nth-child(3){width:220px}.gd th:nth-child(5){width:92px}.gd tr{transition:background .4s}</style>
