<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计原型目录</title>
<style>
  :root{
    --bg:#f6f7f9;
    --card:#ffffff;
    --line:#e6e8ec;
    --text:#1c2128;
    --sub:#6b7280;
    --accent:#1677ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:14px/1.6 "PingFang SC","Microsoft YaHei","Hiragino Sans GB",Arial,sans-serif;
    color:var(--text);background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:56px 24px 80px}
  header{margin-bottom:40px}
  h1{font-size:26px;font-weight:600;letter-spacing:-.3px}
  .desc{margin-top:8px;color:var(--sub);font-size:14px}
  .meta{margin-top:14px;font-size:12px;color:#9aa1ab}
  .meta span+span::before{content:"·";margin:0 8px;color:#cfd4da}
  section{margin-bottom:36px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  h2{font-size:14px;font-weight:600;letter-spacing:.5px}
  .count{font-size:12px;color:#9aa1ab}
  .group{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .group+.group{margin-top:12px}
  .group-title{
    padding:10px 18px;font-size:12px;color:var(--sub);
    background:#fbfcfd;border-bottom:1px solid var(--line);
  }
  ul{list-style:none}
  li+li{border-top:1px solid #f1f2f4}
  a.item{
    display:flex;align-items:center;gap:14px;
    padding:14px 18px;color:var(--text);text-decoration:none;
    transition:background .15s ease;
  }
  a.item:hover{background:#f7faff}
  a.item:hover .name{color:var(--accent)}
  .name{font-size:14px;transition:color .15s ease}
  .tag{
    margin-left:auto;flex-shrink:0;font-size:12px;color:var(--sub);
    font-variant-numeric:tabular-nums;
  }
  .empty{
    padding:22px 18px;color:#9aa1ab;font-size:13px;
    background:var(--card);border:1px dashed var(--line);border-radius:10px;
  }
  footer{margin-top:56px;font-size:12px;color:#9aa1ab;border-top:1px solid var(--line);padding-top:16px}
  code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--sub)}
  @media (max-width:560px){
    .wrap{padding:36px 16px 60px}
    a.item{flex-wrap:wrap;gap:6px}
    .tag{margin-left:0;width:100%}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>设计原型目录</h1>
    <p class="desc">按客户 / 项目分类归档的原型与文档，点击标题即可打开最新版本。</p>
    <p class="meta">
      <span>更新于 2026-11-12</span>
      <span>共 1 个原型 · 0 份文档</span>
    </p>
  </header>

  <section>
    <div class="sec-head">
      <h2>原型</h2>
      <span class="count">prototypes/</span>
    </div>

    <div class="group">
      <div class="group-title">青岛地铁-工地项目</div>
      <ul>
        <li>
          <a class="item" href="prototypes/青岛地铁-工地项目/人脸抓拍机布控库自维护设计稿20261111.html">
            <span class="name">人脸抓拍机布控库自维护设计稿</span>
            <span class="tag">2026-11-11</span>
          </a>
        </li>
      </ul>
    </div>
  </section>

  <section>
    <div class="sec-head">
      <h2>文档</h2>
      <span class="count">docs/</span>
    </div>
    <div class="empty">暂无文档</div>
  </section>

  <footer>
    目录结构：<code>prototypes/&lt;客户&gt;-&lt;项目&gt;/</code> · <code>docs/&lt;客户&gt;-&lt;项目&gt;/</code>
  </footer>

</div>
</body>
</html>
