<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计原型目录</title>
<style>
  :root{
    --bg:#f6f7f9;
    --card:#ffffff;
    --line:#e6e8ec;
    --text:#1c2128;
    --sub:#6b7280;
    --accent:#1677ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:14px/1.6 "PingFang SC","Microsoft YaHei","Hiragino Sans GB",Arial,sans-serif;
    color:var(--text);background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:56px 24px 80px}
  header{margin-bottom:40px}
  h1{font-size:26px;font-weight:600;letter-spacing:-.3px}
  .desc{margin-top:8px;color:var(--sub);font-size:14px}
  .meta{margin-top:14px;font-size:12px;color:#9aa1ab}
  .meta span+span::before{content:"·";margin:0 8px;color:#cfd4da}
  .project{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    overflow:hidden;margin-bottom:16px;
  }
  .project-head{
    display:flex;align-items:baseline;gap:10px;
    padding:14px 20px;border-bottom:1px solid var(--line);background:#fbfcfd;
  }
  .project-head h2{font-size:15px;font-weight:600}
  .project-head .count{margin-left:auto;font-size:12px;color:#9aa1ab}
  .sub{padding:6px 20px 12px}
  .sub-label{
    font-size:12px;color:var(--sub);letter-spacing:.3px;
    padding:10px 0 6px;
  }
  ul{list-style:none}
  li+li{border-top:1px solid #f1f2f4}
  a.item{
    display:flex;align-items:center;gap:14px;
    padding:11px 0;color:var(--text);text-decoration:none;
    transition:color .15s ease;
  }
  a.item:hover .name{color:var(--accent)}
  .name{font-size:14px;transition:color .15s ease}
  .tag{
    margin-left:auto;flex-shrink:0;font-size:12px;color:var(--sub);
    font-variant-numeric:tabular-nums;
  }
  .badge{
    flex-shrink:0;font-size:11px;color:var(--accent);background:#e8f1ff;
    border-radius:4px;padding:1px 6px;line-height:1.5;
  }
  details.versions{margin:0 0 2px}
  details.versions summary{
    list-style:none;cursor:pointer;font-size:12px;color:var(--sub);
    padding:6px 0 8px;user-select:none;
  }
  details.versions summary::-webkit-details-marker{display:none}
  details.versions summary::before{
    content:"▸";display:inline-block;margin-right:6px;transition:transform .15s;
  }
  details.versions[open] summary::before{transform:rotate(90deg)}
  details.versions .item{padding:8px 0 8px 16px}
  details.versions .name{font-size:13px;color:var(--sub)}
  .empty{font-size:13px;color:#9aa1ab;padding:10px 0}
  footer{margin-top:48px;font-size:12px;color:#9aa1ab;border-top:1px solid var(--line);padding-top:16px}
  code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--sub)}
  @media (max-width:560px){
    .wrap{padding:36px 16px 60px}
    a.item{flex-wrap:wrap;gap:4px}
    .tag{margin-left:0;width:100%}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>设计原型目录</h1>
    <p class="desc">按客户 / 项目归档的原型与文档，点击标题即可打开最新版本。</p>
    <p class="meta">
      <span>更新于 2026-11-12</span>
      <span>1 个项目 · 1 个原型 · 1 份文档</span>
    </p>
  </header>

  <section class="project">
    <div class="project-head">
      <h2>青岛地铁-工地项目</h2>
      <span class="count">青岛地铁-工地项目/</span>
    </div>

    <div class="sub">
      <div class="sub-label">原型</div>
      <ul>
        <li>
          <a class="item" href="青岛地铁-工地项目/原型/人脸抓拍机布控库自维护设计稿20261112.html">
            <span class="name">人脸抓拍机布控库自维护设计稿</span>
            <span class="badge">最新</span>
            <span class="tag">2026-11-12</span>
          </a>
          <details class="versions">
            <summary>历史版本 (1)</summary>
            <ul>
              <li>
                <a class="item" href="青岛地铁-工地项目/原型/人脸抓拍机布控库自维护设计稿20261111.html">
                  <span class="name">2026-11-11 版</span>
                  <span class="tag">2026-11-11</span>
                </a>
              </li>
            </ul>
          </details>
        </li>
      </ul>
    </div>

    <div class="sub">
      <div class="sub-label">文档</div>
      <ul>
        <li>
          <a class="item" href="https://github.com/wacilimonster-source/juanev/blob/main/青岛地铁-工地项目/文档/版本记录.md" target="_blank" rel="noopener">
            <span class="name">版本记录</span>
            <span class="badge">最新</span>
            <span class="tag">2026-11-12</span>
          </a>
        </li>
      </ul>
    </div>
  </section>

  <footer>
    目录结构：<code>&lt;客户&gt;-&lt;项目&gt;/原型/</code> · <code>&lt;客户&gt;-&lt;项目&gt;/文档/</code><br>
    版本规则：同名文件按日期沉淀，最新版作为入口，旧版保留可回溯。
  </footer>

</div>
</body>
</html>
