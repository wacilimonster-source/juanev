<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../assets/gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人脸抓拍机与布控库 - 设计稿</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 "Microsoft YaHei","PingFang SC",Arial,sans-serif;color:#333;background:#f2f3f5}
a{color:#1677ff;cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}a.dis{color:#c3c7cf;cursor:not-allowed;margin-right:10px}
.header{height:58px;background:#131b2b;display:flex;align-items:center;padding:0 20px;color:#fff;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px;margin-right:34px;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#2ee6ff,#1677ff);display:grid;place-items:center;font-size:11px;font-weight:700;color:#08202e}
.brand b{font-size:17px;letter-spacing:.5px}
.brand small{font-size:14px;color:#e2e9f3}
.hnav{display:flex;gap:24px;color:#c2cbd9;font-size:14px}
.hnav span{cursor:pointer;padding:4px 0;white-space:nowrap}.hnav span:hover{color:#fff}.hnav span.on{color:#fff;border-bottom:2px solid #1677ff}
.user{margin-left:auto;color:#fff;font-size:14px}
.dnav{height:42px;background:#fff;border-bottom:1px solid #e9ecf0;display:flex;align-items:center;gap:8px;padding:0 20px;position:sticky;top:58px;z-index:35}
.dnav b{font-size:12px;color:#98a1af;font-weight:400;margin-right:4px}
.dnav span{padding:5px 12px;border-radius:14px;font-size:13px;color:#5c6673;cursor:pointer}
.dnav span:hover{background:#f2f5f9}
.dnav span.on{background:#e8f1ff;color:#1677ff}
.dnav .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.body{display:flex;min-height:calc(100vh - 100px)}
.rail{width:76px;background:#fff;border-right:1px solid #e9ecf0;padding-top:8px;flex-shrink:0}
.rail div{padding:9px 0;text-align:center;color:#6b7684;font-size:12px;cursor:pointer;line-height:1.35}
.rail div i{display:block;font-size:19px;font-style:normal;line-height:24px;color:#8b95a4}
.rail div:hover{color:#1677ff}.rail div.on{color:#1677ff}.rail div.on i{color:#1677ff}
.main{flex:1;min-width:0;padding:12px 16px 26px}
.crumb{color:#99a1ac;font-size:13px;margin-bottom:10px}.crumb b{color:#333;font-weight:400}
.card{background:#fff;border-radius:4px;padding:14px 16px;margin-bottom:12px;overflow-x:auto}
.card-h{font-size:14px;font-weight:600;margin-bottom:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.bar .r{margin-left:auto}
.btn{height:32px;padding:0 14px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;cursor:pointer;font:inherit;font-size:13px;color:#333}
.btn:hover{color:#1677ff;border-color:#1677ff}
.btn.p{background:#1677ff;border-color:#1677ff;color:#fff}.btn.p:hover{background:#4096ff;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:28px;padding:0 10px}
input,select{border:1px solid #d9d9d9;border-radius:4px;padding:0 10px;height:32px;font:inherit;font-size:13px;background:#fff;color:#333}
input:focus,select:focus{outline:none;border-color:#1677ff}
input:disabled{background:#f5f6f8;color:#a8aeb8}
table{width:100%;border-collapse:collapse}
th{background:#f7f8fa;color:#666;font-weight:500;font-size:13px;text-align:left;padding:10px 12px;border-bottom:1px solid #eef0f3;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #f2f4f7;font-size:13px;vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:#fafcff}
td a{margin-right:12px}td a:last-child{margin-right:0}
.tag{display:inline-block;padding:0 7px;border-radius:3px;font-size:12px;line-height:20px;border:1px solid #91caff;background:#e6f4ff;color:#1677ff;margin:1px 4px 1px 0}
.tag.g{border-color:#b7eb8f;background:#f6ffed;color:#389e0d}
.tag.gray{border-color:#e0e2e7;background:#fafafa;color:#8c939d}
.tag.o{border-color:#ffd591;background:#fff7e6;color:#d46b08}
.ok{color:#52c41a}.err{color:#f5222d}.mute{color:#98a1af}.warn{color:#fa8c16}
.dm{display:flex;gap:12px;align-items:flex-start}
.tree{width:168px;background:#fff;border-radius:4px;padding:10px;flex-shrink:0}
.tree .t{padding:7px 10px;border-radius:4px;font-size:13px;color:#4a5361;cursor:pointer}
.tree .t:hover{background:#f5f7fa}.tree .t.on{background:#e8f1ff;color:#1677ff}
.tree .t.child{padding-left:26px;color:#5f6875}
.thumb{width:38px;height:30px;border-radius:3px;background:#eef1f5;display:inline-block;vertical-align:middle}
.tip{background:#f0f7ff;border:1px solid #cfe4ff;color:#265b93;border-radius:4px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.warnbox{background:#fff8e6;border:1px solid #ffe0a3;color:#8a5b00;border-radius:4px;padding:8px 12px;font-size:13px;margin:10px 0}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{border:1px solid #eceef2;border-radius:4px;padding:9px 11px;font-size:13px}
.mode b{display:block;margin-bottom:3px;font-size:13px}
.edit{display:flex;gap:14px}.edit .l{flex:1;min-width:0}.edit .rt{width:400px;flex-shrink:0}
.video{height:300px;background:#1b2333;border-radius:4px;position:relative;color:#93a6bf;display:grid;place-items:center;font-size:13px}
.video .box{position:absolute;left:16%;top:18%;width:58%;height:62%;border:2px solid #1677ff;background:#1677ff18}
.sec{font-weight:600;font-size:13px;margin:2px 0 10px;color:#333}
.sec:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;border:2px solid #1677ff;margin-right:6px;vertical-align:1px}
.fm{display:grid;grid-template-columns:96px 1fr;gap:10px 8px;align-items:center;font-size:13px}
.fm>label{color:#5f6875}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:32px;align-items:center;border:1px solid #d9d9d9;border-radius:4px;padding:4px 8px;background:#fff}
.chip{background:#e8f1ff;color:#1677ff;border-radius:3px;padding:2px 6px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip b{cursor:pointer;font-weight:400;color:#6ba7f0}
.mask{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:70}
.mask.on{display:flex}
.drop{position:fixed;z-index:95;background:#fff;border:1px solid #e4e7ec;border-radius:6px;box-shadow:0 8px 24px #0002;width:280px;display:none;flex-direction:column;font-size:13px}
.drop.on{display:flex}
.drop .dh{padding:8px;border-bottom:1px solid #f0f2f5}
.drop .dh input{width:100%;height:30px}
.drop .dl{max-height:190px;overflow:auto;padding:6px 4px}
.drop .dl .lrow{display:flex;gap:6px;align-items:center;padding:5px 8px;border-radius:4px;cursor:pointer}
.drop .dl .lrow:hover{background:#f5f8ff}
.drop .dl .lrow label{cursor:pointer;flex:1}
.drop .df{padding:8px;border-top:1px solid #f0f2f5;display:flex;justify-content:flex-end;gap:10px;align-items:center}
.drop .empty{padding:16px;text-align:center;color:#98a1af;font-size:12px}
.menu{position:fixed;z-index:96;background:#fff;border-radius:4px;box-shadow:0 6px 18px #0003;min-width:132px;padding:4px 0;display:none;font-size:13px}
.menu.on{display:block}
.menu a,.menu div{display:block;padding:8px 16px;color:#333;text-decoration:none;cursor:pointer;white-space:nowrap}
.menu a:hover,.menu div:hover{background:#e8f1ff;color:#1677ff}
.dlg{background:#fff;border-radius:6px;width:620px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.dlg h4{padding:14px 18px;border-bottom:1px solid #eef0f3;font-size:15px;font-weight:600;flex-shrink:0}
.dlg .bd{padding:16px 18px;overflow:auto;flex:1}
.dlg .ft{padding:10px 18px;border-top:1px solid #eef0f3;text-align:right;flex-shrink:0}
.dlg .bd table td:last-child{white-space:normal;min-width:150px;font-size:12px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:620px;max-width:96vw;background:#fff;box-shadow:-4px 0 18px #0002;display:none;flex-direction:column;z-index:65}
.drawer.on{display:flex}
.drawer h4{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #eef0f3;font-size:15px;font-weight:600}
.drawer h4 span{cursor:pointer;color:#98a1af;font-weight:400;font-size:18px}
.drawer .bd{flex:1;overflow:auto;padding:18px 20px}
.drawer .ft{border-top:1px solid #eef0f3;padding:12px 20px;text-align:right;display:flex;gap:8px;justify-content:flex-end}
.field{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-bottom:14px;font-size:13px}
.field>label{color:#5f6875;text-align:right}
.field>label em{color:#f5222d;font-style:normal;margin-right:2px}
.field .ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.radios{display:flex;gap:16px;align-items:center;font-size:13px}
.radios label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.toast{position:fixed;top:112px;left:50%;transform:translateX(-50%);background:#fff;box-shadow:0 4px 14px #0003;padding:9px 16px;border-radius:4px;font-size:13px;display:none;z-index:80}
.rq{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#ff4d4f;color:#fff;font-size:11px;font-weight:700;cursor:pointer;margin:0 3px;vertical-align:middle;line-height:1}
.rq.chg{background:#1677ff}
.rq.flash{animation:fl 1s 3}@keyframes fl{50%{box-shadow:0 0 0 6px #ff4d4f55}}
body.noreq .rq,body.noreq .panel{display:none}
.pop{position:absolute;z-index:90;background:#fff;border:1px solid #ffb3b3;border-radius:4px;box-shadow:0 4px 14px #0002;padding:10px 12px;width:320px;font-size:13px;display:none}
.pop b{color:#cf1322}
.panel{width:320px;background:#fff;border-left:1px solid #e9ecf0;padding:14px;overflow:auto;max-height:calc(100vh - 100px);position:sticky;top:100px;flex-shrink:0}
@media(max-width:1400px){
  .panel{position:fixed;right:0;top:100px;bottom:0;z-index:46;max-height:none;display:none;box-shadow:-6px 0 18px #0002}
  body.showreq .panel{display:block}
  body.noreq .panel{display:none}
}
@media(max-width:1100px){.hnav{display:none}}
.panel h3{font-size:14px;margin-bottom:8px}
.panel .it{padding:7px 0;border-bottom:1px dashed #eef0f3;font-size:13px;cursor:pointer}
.panel .it:hover{background:#fafcff}.panel .it p{color:#7a828e;margin-top:2px;font-size:12px}
.flows{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flows .card{margin:0}.flows svg{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.steps{display:flex;gap:0;align-items:stretch}
.step{flex:1;border:1px solid #eceef2;border-radius:4px;padding:10px;font-size:12px;color:#5f6875;position:relative;background:#fafbfd}
.step b{display:block;color:#333;font-size:13px;margin-bottom:4px}
.step+.step{margin-left:22px}
.step+.step:before{content:"›";position:absolute;left:-16px;top:50%;transform:translateY(-50%);color:#c2c9d4;font-size:20px}
</style>
</head>

function svgFlow(nodes, edges, H) {
  let s = `<svg viewBox="0 0 340 ${H}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa3ae"/></marker></defs>`;
  edges.forEach(([f, t, lb]) => {
    const a = nodes[f], b = nodes[t];
    let d, lx, ly;
    if (a.x === b.x) { d = `M${a.x},${a.y + a.h / 2} V${b.y - b.h / 2}`; lx = a.x + 6; ly = a.y + a.h / 2 + 13; }
    else if (a.k === 'd' && Math.abs(a.y - b.y) < 6) { const sg = b.x > a.x ? 1 : -1, x1 = a.x + sg * a.w / 2; d = `M${x1},${a.y} H${b.x - sg * b.w / 2}`; lx = (x1 + b.x - sg * b.w / 2) / 2 - 6; ly = a.y - 6; }
    else if (a.k === 'd') { const sg = b.x > a.x ? 1 : -1, x1 = a.x + sg * a.w / 2; d = `M${x1},${a.y} H${b.x} V${b.y - b.h / 2}`; lx = (x1 + b.x) / 2 - 6; ly = a.y - 6; }
    else { const yt = b.y - b.h / 2; d = `M${a.x},${a.y + a.h / 2} V${yt - 12} H${b.x} V${yt}`; }
    s += `<path d="${d}" fill="none" stroke="#9aa3ae" stroke-width="1.3" marker-end="url(#ar)"/>`;
    if (lb) s += `<text x="${lx}" y="${ly}" font-size="11" fill="#d46b08">${lb}</text>`;
  });
  nodes.forEach(n => {
    const [bg, bd] = NS[n.k];
    if (n.k === 'd') s += `<polygon points="${n.x},${n.y - n.h / 2} ${n.x + n.w / 2},${n.y} ${n.x},${n.y + n.h / 2} ${n.x - n.w / 2},${n.y}" fill="${bg}" stroke="${bd}"/>`;
    else s += `<rect x="${n.x - n.w / 2}" y="${n.y - n.h / 2}" width="${n.w}" height="${n.h}" rx="${n.k === 's' ? 16 : 4}" fill="${bg}" stroke="${bd}"/>`;
    const ls = n.t.split('|'), y0 = n.y - (ls.length - 1) * 8 + 4;
    ls.forEach((l, i) => { s += `<text x="${n.x}" y="${y0 + i * 15}" font-size="11.5" text-anchor="middle" fill="${i ? '#6b7684' : '#333'}">${l}</text>`; });
  });
  return s + '</svg>';
}

      <div class="fm">
        ${face ? `<span>取图间隔</span><div><span class="mute">--</span><div class="mute" style="font-size:12px">人脸抓拍机由相机推送图片，无需设置间隔</div></div>`
          : `<span>${d.mode === '视频流' ? '抽帧间隔(ms)' : '抓拍间隔(ms)'}</span><div><input value="${d.mode === '视频流' ? 1000 : 4000}" style="width:140px"><div class="mute" style="font-size:12px">由设备模式决定，改模式请到设备管理</div></div>`}
        <span>报警间隔(s)</span><div><input value="30" style="width:140px"></div>
      </div>
      ${face ? '' : `<div class="sec" style="margin-top:14px">海康通道号</div><div class="fm">
        <span>下发通道号</span><div><input value="39" readonly style="width:110px"></div>
        <span>转换后通道号</span><div><input value="7" style="width:110px"> <button class="btn sm">保存</button></div></div>`}
    </div>
  </div>
  <div style="text-align:center;margin-top:16px">
    <button class="btn" onclick="go('device')">取消</button>
    <button class="btn p" onclick="saveSource()">保存至当前</button>
    ${face ? `<button class="btn" onclick="batchSaveDlg()">保存至批量 ${R(9)}</button>` : ''}
  </div>
</div>`;
};
function dropSrcLib(l) { SLIBS = SLIBS.filter(x => x !== l); render(); }
function saveSource() {
  if (isFace(devOf(SDEV))) {
    if (!SLIBS.length) { toast('请选择布控库后再保存'); return; }
    devOf(SDEV).libs = SLIBS.slice();
  }
  toast('已保存至当前输入源'); render();
}
function faceTargets() { return boundList().filter(id => id !== SDEV && isFace(devOf(id))); }
function batchSaveDlg() {
  const n = faceTargets().length;
  openDlg('保存至批量', `<div class="tip">布控库随当前输入源一起复制到该算法下的其他 ${n} 台人脸抓拍机，不可单独修改 ${R(9)}</div>
<div class="fm">
  <span>布控库</span><div>${SLIBS.map(l => `<span class="tag">${l}</span>`).join('') || '<span class="err">未选择</span>'}</div>
  <span>生效参数</span><div>
    <label style="display:block"><input type="checkbox" checked> ROI</label>
    <label style="display:block"><input type="checkbox" checked> 间隔参数</label>
    <label style="display:block"><input type="checkbox"> 算法配置</label></div>
</div>`,
  `<button class="btn" onclick="closeDlg()">取消</button> <button class="btn p" onclick="doBatchSave()">确认</button>`);
}
function doBatchSave() {
  const ids = faceTargets();
  if (!ids.length) { toast('该算法下没有其他人脸抓拍机'); return; }
  ids.forEach(id => { devOf(id).libs = SLIBS.slice(); });
  closeDlg(); toast(`已保存至 ${ids.length} 台人脸抓拍机`); render();
}
// 导航与通用
const TABS = [['flow', '需求与流程'], ['device', '原型：设备管理'], ['source', '原型：输入源配置']];
const RAIL = ['星际大模型', '场景提示词', '算法商城', '算法仓库', '算法配置', '我的算法', '报警记录'];
let CUR = 'flow';
function go(page) { CUR = page; render(); window.scrollTo(0, 0); }
function render() {
  $('dnav').innerHTML = TABS.map(t => `<span class="${CUR === t[0] ? 'on' : ''}" onclick="go('${t[0]}')">${t[1]}</span>`).join('');
  $('rail').innerHTML = RAIL.map(r => `<div class="${CUR === 'source' && r === '算法配置' ? 'on' : ''}"><i>◈</i>${r}</div>`).join('');
  $('main').innerHTML = PAGES[CUR]();
}
function openDlg(t, body, foot) { $('dt').textContent = t; $('db').innerHTML = body; $('df').innerHTML = foot; $('mask').classList.add('on'); }
function closeDlg() { $('mask').classList.remove('on'); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 2200); }
function toggleReq() {
  if (window.innerWidth <= 1400) document.body.classList.toggle('showreq');
  else document.body.classList.toggle('noreq');
}
drawPanel(); render();
</script>
</body>
</html>
